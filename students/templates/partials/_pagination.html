{% if page_obj.paginator.num_pages > 1 %}
<div class="flex items-center justify-between px-5 py-4 border-t border-outline-variant/20 flex-wrap gap-space-sm">
  <span class="font-label-sm text-label-sm text-on-surface-variant">
    Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }} · {{ page_obj.paginator.count }} total
  </span>
  <div class="flex items-center gap-1.5">
    {% if page_obj.has_previous %}
    <a href="?{% if query %}q={{ query }}&{% endif %}page={{ page_obj.previous_page_number }}" class="px-3 py-1.5 rounded-lg border border-outline-variant/50 text-on-surface font-label-sm text-label-sm hover:bg-surface-container-low transition-colors">Prev</a>
    {% endif %}
    <span class="px-3 py-1.5 rounded-lg bg-gradient-to-r from-primary to-secondary text-on-primary font-label-sm text-label-sm">{{ page_obj.number }}</span>
    {% if page_obj.has_next %}
    <a href="?{% if query %}q={{ query }}&{% endif %}page={{ page_obj.next_page_number }}" class="px-3 py-1.5 rounded-lg border border-outline-variant/50 text-on-surface font-label-sm text-label-sm hover:bg-surface-container-low transition-colors">Next</a>
    {% endif %}
  </div>
</div>
{% endif %}
